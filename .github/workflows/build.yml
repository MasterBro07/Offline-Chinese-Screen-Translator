name: Build

# Packs the Chrome extension, including the offline text recognition for images.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch offline OCR files (models + runtime, checked against npm integrity)
        run: node tools/fetch-ocr-assets.mjs

      - name: Syntax check
        run: for f in extension/*.js extension/ocr/ocr.js tools/*.mjs; do node --check "$f"; done

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: AutoTranslator-chrome-extension
          path: extension/
          if-no-files-found: error
