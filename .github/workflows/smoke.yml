name: Smoke

# Runs the desktop app for real on a Windows runner: capture, OCR, overlay, bridge, shipped exe.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chinese OCR recognizer (best effort)
        shell: powershell
        run: ./tests/smoke/Install-ChineseOcr.ps1

      - name: Desktop session probe
        shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber
          Get-CimInstance Win32_VideoController | Format-List Name, CurrentHorizontalResolution, CurrentVerticalResolution
          "Session: $([Diagnostics.Process]::GetCurrentProcess().SessionId)  Interactive: $([Environment]::UserInteractive)  User: $env:USERNAME"
          Get-Process dwm, explorer, winlogon -ErrorAction SilentlyContinue | Format-Table Name, Id, SessionId
          Get-ChildItem C:\Windows\Fonts | Where-Object { $_.Name -match '^(msyh|simsun|simhei|msjh|deng|segoeui)' } | Format-Table Name, Length
