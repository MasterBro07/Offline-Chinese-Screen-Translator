name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch offline OCR files (models + runtime, checked against npm integrity)
        run: node tools/fetch-ocr-assets.mjs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test Core
        run: dotnet test tests/AutoTranslator.Core.Tests -c Release

      # Self-contained single-file exe: the user does not need to install .NET.
      # No trimming: WPF does not support it.
      - name: Publish desktop app
        if: ${{ !cancelled() }}
        run: dotnet publish src/AutoTranslator.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload desktop app
        uses: actions/upload-artifact@v4
        with:
          name: AutoTranslator-windows
          path: publish/
          if-no-files-found: error

      - name: Upload Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: AutoTranslator-chrome-extension
          path: extension/
          if-no-files-found: error
