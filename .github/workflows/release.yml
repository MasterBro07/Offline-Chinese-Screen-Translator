name: Release

# Start by hand: Actions → Release → "Run workflow". Packs the Chrome extension (with the offline
# text recognition) and publishes it as a ZIP file on a new GitHub Release (downloadable without a
# GitHub account).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 2.0.0"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch offline OCR files (models + runtime, checked against npm integrity)
        run: node tools/fetch-ocr-assets.mjs

      - name: Package
        run: cd extension && zip -qr ../AutoTranslator-chrome-extension.zip .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          cat > notes.md <<NOTES
          Translates Chinese text in Chrome into English automatically, 100 % offline: page text, text in images, and a writing helper (type English, insert Chinese).

          **Download:** \`AutoTranslator-chrome-extension.zip\`, unzip it and load the folder on \`chrome://extensions\` (Developer mode → Load unpacked).

          Step-by-step setup: see the [README](https://github.com/${{ github.repository }}#installation-tutorial).
          NOTES
          gh release create "v$VERSION" AutoTranslator-chrome-extension.zip \
            --target "${{ github.sha }}" --title "AutoTranslator $VERSION" --notes-file notes.md
