name: Extension

# Chrome extension tests on Windows, macOS and Linux, including one attempt at a real on-device
# translation (the language pack download usually stalls on CI runners; it works on real PCs). Started by hand: Actions → Extension → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch offline OCR files (models + runtime, checked against npm integrity)
        run: node tools/fetch-ocr-assets.mjs

      - name: Install Playwright
        shell: pwsh
        run: |
          npm i playwright
          npx playwright install chromium

      - name: Extension tests with real translation (Chromium)
        id: chromium
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 8
        run: |
          node extension-tests/run.js --real 2>&1 | Tee-Object -FilePath extension-chromium.log
          $code = $LASTEXITCODE
          $line = Select-String -Path extension-chromium.log -Pattern 'REAL_TRANSLATION: (\w+)' | Select-Object -Last 1
          $result = if ($line) { $line.Matches[0].Groups[1].Value } else { 'MISSING' }
          "result=$result" >> $env:GITHUB_OUTPUT
          exit $code

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem extension-*.log -ErrorAction SilentlyContinue) {
            $pass = (Select-String -Path $f -Pattern '^PASS ').Count
            $fail = (Select-String -Path $f -Pattern '^FAIL ').Count
            $real = Select-String -Path $f -Pattern 'REAL_TRANSLATION: \w+' | Select-Object -Last 1
            "$($f.Name): $pass passed, $fail failed, $($real.Line)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY
          }
          if ("${{ steps.chromium.outcome }}" -ne 'success') { exit 1 }

      - name: Upload extension test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-results-${{ matrix.os }}
          path: extension-*.log
          if-no-files-found: warn
